<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style A: Bold Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080A0F;
    --accent: #E8FF47;
    --text: #F0EDE8;
    --muted: rgba(240,237,232,0.4);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  .slide {
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(2rem, 6vw, 6rem);
    position: relative;
    overflow: hidden;
  }

  /* Faint horizontal rule */
  .slide::before {
    content: '';
    position: absolute;
    left: clamp(2rem, 6vw, 6rem);
    right: clamp(2rem, 6vw, 6rem);
    top: 50%;
    height: 1px;
    background: rgba(240,237,232,0.06);
  }

  /* Accent dot */
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    margin-bottom: clamp(1.5rem, 3vw, 3rem);
    opacity: 0;
    animation: fadein 0.4s 0.2s forwards;
  }

  .label {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(0.7rem, 1vw, 0.85rem);
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: clamp(1rem, 2vw, 2rem);
    opacity: 0;
    animation: slideup 0.6s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 10vw, 10rem);
    color: var(--text);
    line-height: 0.92;
    letter-spacing: -0.01em;
    opacity: 0;
    animation: slideup 0.8s 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  h1 em {
    color: var(--accent);
    font-style: normal;
  }

  .sub {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(0.9rem, 1.5vw, 1.2rem);
    color: var(--muted);
    font-weight: 300;
    margin-top: clamp(1.5rem, 2.5vw, 2.5rem);
    max-width: 520px;
    line-height: 1.6;
    opacity: 0;
    animation: slideup 0.8s 0.75s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  .corner-label {
    position: absolute;
    bottom: clamp(1.5rem, 3vw, 3rem);
    right: clamp(2rem, 6vw, 6rem);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    opacity: 0;
    animation: fadein 0.5s 1s forwards;
  }

  @keyframes fadein {
    to { opacity: 1; }
  }
  @keyframes slideup {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="dot"></div>
    <div class="label">Sentinel · Demo 2026</div>
    <h1>We thought people<br>wanted <em>agents</em><br>doing the work.</h1>
    <p class="sub">We were building for automation. Turns out, the most important decisions still happen in a room.</p>
    <div class="corner-label">Style A — Bold Signal</div>
  </div>
</body>
</html>
