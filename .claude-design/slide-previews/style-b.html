<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style B: Chalk Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #F5F1EB;
  }

  .slide {
    width: 100vw; height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
    position: relative;
  }

  /* Left: dark panel */
  .left {
    background: #1A1A1A;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: clamp(2rem, 5vw, 5rem);
    position: relative;
    overflow: hidden;
  }

  /* Vertical text on left edge */
  .left::before {
    content: 'SENTINEL';
    position: absolute;
    top: 50%;
    left: 1.5rem;
    transform: translateY(-50%) rotate(-90deg);
    font-family: 'Inter', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.4em;
    color: rgba(255,255,255,0.2);
  }

  /* Thin accent line */
  .accent-line {
    width: 40px; height: 3px;
    background: #FF6B35;
    margin-bottom: clamp(1.5rem, 3vw, 3rem);
    opacity: 0;
    animation: growline 0.6s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
    transform-origin: left;
    transform: scaleX(0);
  }

  .left h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    color: #F5F1EB;
    line-height: 1.05;
    font-style: italic;
    opacity: 0;
    animation: slideup 0.9s 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  .left h1 span {
    font-style: normal;
    color: #FF6B35;
  }

  /* Right: cream panel */
  .right {
    background: #F5F1EB;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(2rem, 5vw, 5rem);
    border-left: 1px solid rgba(26,26,26,0.08);
  }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #FF6B35;
    margin-bottom: clamp(1.5rem, 2vw, 2rem);
    opacity: 0;
    animation: fadein 0.6s 0.6s forwards;
  }

  .right p {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(1.1rem, 2.2vw, 1.8rem);
    color: #1A1A1A;
    line-height: 1.45;
    font-style: italic;
    opacity: 0;
    animation: slideup 0.8s 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  .quote-mark {
    font-family: 'Instrument Serif', serif;
    font-size: 5rem;
    color: rgba(26,26,26,0.08);
    line-height: 1;
    margin-bottom: -1.5rem;
    opacity: 0;
    animation: fadein 0.5s 0.7s forwards;
  }

  .corner-label {
    position: absolute;
    bottom: clamp(1.5rem, 3vw, 3rem);
    right: clamp(2rem, 5vw, 5rem);
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    color: rgba(26,26,26,0.3);
    letter-spacing: 0.1em;
    opacity: 0;
    animation: fadein 0.5s 1.2s forwards;
  }

  @keyframes fadein {
    to { opacity: 1; }
  }
  @keyframes slideup {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes growline {
    to { opacity: 1; transform: scaleX(1); }
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="left">
      <div class="accent-line"></div>
      <h1>We thought people wanted <span>agents</span> doing the work.</h1>
    </div>
    <div class="right">
      <div class="eyebrow">Sentinel · 2026</div>
      <div class="quote-mark">"</div>
      <p>We were building for full automation. Turns out, the most important decisions still happen in a room. Around a deck.</p>
    </div>
    <div class="corner-label">Style B — Split Editorial</div>
  </div>
</body>
</html>
