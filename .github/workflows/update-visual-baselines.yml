name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update snapshots on'
        required: false
        default: 'main'

env:
  APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: "10.27.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install

      - name: Setup test database
        run: npx tsx scripts/setup-test-data.ts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate visual baselines
        run: pnpm test:visual:update
        continue-on-error: true

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/pages.spec.ts-snapshots/
          git diff --staged --quiet && echo "No snapshot changes" && exit 0
          git commit -m "chore: update visual test baselines [skip ci]"
          git push
